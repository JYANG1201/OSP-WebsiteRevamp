<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <!--
    SIGNAL · hero video poster
    ─────────────────────────────────────────────────────────────
    Stands in for /videos/hero-signal-*.mp4 until the real footage
    lands. Deliberately calm: near-black ground, one soft ambient
    amber light source (glass lit from behind, not fire), the
    direction's concentric "signal" rings, and a hairline column
    grid that echoes the site's structural lines.
    Palette is the Signal palette only — #050505 / #17140F /
    #1C1C1E / #FF6B35 / #FFA94D.
  -->
  <defs>
    <!-- the ambient warm source, upper right of centre -->
    <radialGradient id="sigPosterWarm" cx="0.63" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#FFA94D" stop-opacity="0.30" />
      <stop offset="0.22" stop-color="#FF8A4C" stop-opacity="0.17" />
      <stop offset="0.46" stop-color="#FF6B35" stop-opacity="0.075" />
      <stop offset="0.74" stop-color="#FF6B35" stop-opacity="0.018" />
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0" />
    </radialGradient>

    <!-- a second, cooler bloom low-left keeps the frame from feeling lit from one lamp -->
    <radialGradient id="sigPosterCool" cx="0.16" cy="0.86" r="0.6">
      <stop offset="0" stop-color="#1C1C1E" stop-opacity="0.9" />
      <stop offset="0.5" stop-color="#17140F" stop-opacity="0.45" />
      <stop offset="1" stop-color="#050505" stop-opacity="0" />
    </radialGradient>

    <!-- ground: warm-black, not neutral-black -->
    <linearGradient id="sigPosterGround" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0B0A09" />
      <stop offset="0.52" stop-color="#070706" />
      <stop offset="1" stop-color="#050505" />
    </linearGradient>

    <!-- edge vignette so the poster melts into the page background -->
    <radialGradient id="sigPosterVignette" cx="0.55" cy="0.44" r="0.78">
      <stop offset="0.42" stop-color="#050505" stop-opacity="0" />
      <stop offset="0.78" stop-color="#050505" stop-opacity="0.42" />
      <stop offset="1" stop-color="#050505" stop-opacity="0.9" />
    </radialGradient>

    <linearGradient id="sigPosterSheen" x1="0" y1="0" x2="1" y2="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0.055" />
      <stop offset="0.58" stop-color="#FFA94D" stop-opacity="0.035" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="sigPosterSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="38" />
    </filter>
    <filter id="sigPosterSofter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="74" />
    </filter>

    <clipPath id="sigPosterFrame">
      <rect width="1920" height="1080" />
    </clipPath>
  </defs>

  <g clip-path="url(#sigPosterFrame)">
    <!-- ── ground ─────────────────────────────────────────── -->
    <rect width="1920" height="1080" fill="url(#sigPosterGround)" />
    <rect width="1920" height="1080" fill="url(#sigPosterCool)" />

    <!-- ── structural hairline columns (the site's grid) ───── -->
    <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1">
      <line x1="240" y1="0" x2="240" y2="1080" />
      <line x1="600" y1="0" x2="600" y2="1080" />
      <line x1="960" y1="0" x2="960" y2="1080" />
      <line x1="1320" y1="0" x2="1320" y2="1080" />
      <line x1="1680" y1="0" x2="1680" y2="1080" />
    </g>

    <!-- ── the ambient warm source ─────────────────────────── -->
    <g filter="url(#sigPosterSofter)">
      <ellipse cx="1210" cy="392" rx="720" ry="560" fill="url(#sigPosterWarm)" />
    </g>
    <g filter="url(#sigPosterSoft)" opacity="0.55">
      <ellipse cx="1330" cy="300" rx="300" ry="240" fill="#FFA94D" fill-opacity="0.10" />
    </g>

    <!-- ── concentric signal rings, centred on the light ───── -->
    <g fill="none" transform="translate(1210 420)">
      <circle r="118" stroke="#FF6B35" stroke-opacity="0.26" stroke-width="1.25" />
      <circle r="212" stroke="#FFA94D" stroke-opacity="0.15" stroke-width="1.1" stroke-dasharray="3 11" />
      <circle r="318" stroke="#FFFFFF" stroke-opacity="0.075" stroke-width="1" />
      <circle r="436" stroke="#FF6B35" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="1.5 14" />
      <circle r="566" stroke="#FFFFFF" stroke-opacity="0.038" stroke-width="1" />
      <circle r="712" stroke="#FF6B35" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="1.5 18" />
    </g>

    <!-- a single bright arc on the inner ring reads as a lens edge -->
    <path
      d="M1210 302 A118 118 0 0 1 1322 456"
      fill="none"
      stroke="#FFA94D"
      stroke-opacity="0.6"
      stroke-width="1.6"
      stroke-linecap="round"
    />

    <!-- ── measured dot field, low-left, softly masked ─────── -->
    <g fill="#FFFFFF" fill-opacity="0.055">
      <circle cx="180" cy="760" r="1.6" /><circle cx="252" cy="760" r="1.6" /><circle cx="324" cy="760" r="1.6" />
      <circle cx="396" cy="760" r="1.6" /><circle cx="468" cy="760" r="1.6" /><circle cx="540" cy="760" r="1.6" />
      <circle cx="180" cy="832" r="1.6" /><circle cx="252" cy="832" r="1.6" /><circle cx="324" cy="832" r="1.6" />
      <circle cx="396" cy="832" r="1.6" /><circle cx="468" cy="832" r="1.6" />
      <circle cx="180" cy="904" r="1.6" /><circle cx="252" cy="904" r="1.6" /><circle cx="324" cy="904" r="1.6" />
      <circle cx="180" cy="976" r="1.6" /><circle cx="252" cy="976" r="1.6" />
    </g>

    <!-- ── glass sheen band across the frame ───────────────── -->
    <path d="M-200 1080 L720 -80 L1180 -80 L260 1080 Z" fill="url(#sigPosterSheen)" opacity="0.7" />

    <!-- ── vignette + base fade into the page ──────────────── -->
    <rect width="1920" height="1080" fill="url(#sigPosterVignette)" />
    <rect y="880" width="1920" height="200" fill="#050505" opacity="0.55" />
  </g>
</svg>
